name: Release

on:
  workflow_dispatch:
      inputs:
        version:
          description: "New version, e.g. 0.3.0"
          required: true
          type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Bump Cargo.toml version
        run: |
          nix develop -c cargo set-version "${{ inputs.version }}"
          cargo update --workspace

      - name: Build
        run: nix develop -c cargo build --release --locked

      - name: Build C-Bindings
        run: |
          mkdir -p dist
          nix develop -c cbindgen > dist/wasserxr.h

      - name: Run nix flake check
        run: nix flake check --print-build-logs

      - name: Create Version Bump Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release: ${{ inputs.version }}"

      - name: Create tag
        run: |
          git tag "${{ inputs.version }}"
          git push origin HEAD
          git push origin "${{ inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.version }}"
          name: "${{ inputs.version }}"
          files: |
            dist/wasserxr.h
            target/release/libwasserxr.a

      - name: Publish macros crate
        run: |
          nix develop -c cargo publish -p wasserxr-macros --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES }}

      - name: Publish root crate
        run: |
          nix develop -c cargo publish -p wasserxr --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES }}
