name: Publish Crates

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Build
        run: nix develop -c cargo build --workspace --locked

      - name: Publish macros crate
        run: |
          version="$(nix develop -c cargo pkgid -p wasserxr-macros)"
          version="${version##*#}"
          version="${version##*@}"
          if curl --fail --silent --show-error "https://crates.io/api/v1/crates/wasserxr-macros/${version}" > /dev/null; then
            echo "wasserxr-macros ${version} is already published"
          else
            nix develop -c cargo publish -p wasserxr-macros --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES }}

      - name: Wait for macros crate
        run: |
          version="$(nix develop -c cargo pkgid -p wasserxr-macros)"
          version="${version##*#}"
          version="${version##*@}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "https://crates.io/api/v1/crates/wasserxr-macros/${version}" > /dev/null; then
              exit 0
            fi
            sleep 30
          done
          echo "wasserxr-macros ${version} did not appear in the crates.io index"
          exit 1

      - name: Publish root crate
        run: |
          version="$(nix develop -c cargo pkgid -p wasserxr)"
          version="${version##*#}"
          version="${version##*@}"
          if curl --fail --silent --show-error "https://crates.io/api/v1/crates/wasserxr/${version}" > /dev/null; then
            echo "wasserxr ${version} is already published"
          else
            nix develop -c cargo publish -p wasserxr --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES }}
