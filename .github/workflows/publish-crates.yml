name: Publish Crates

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Build
        run: nix develop -c cargo build --workspace --locked

      - name: Publish macros crate
        run: |
          nix develop -c cargo publish -p wasserxr-macros --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES }}

      - name: Publish root crate
        run: |
          nix develop -c cargo publish -p wasserxr --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES }}
