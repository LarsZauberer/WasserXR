[package]
name = "wasserxr-macros"
version = "0.2.4"
edition = "2024"
description = "Procedural macros for WasserXR components, systems, and assets."
readme = "../README.md"
repository = "https://github.com/LarsZauberer/WasserXR"
license-file = "../LICENSE.md"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "parsing"] }

[package.metadata.release]
tag = false
