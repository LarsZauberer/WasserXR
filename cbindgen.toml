language = "C"
include_guard = "WASSERXR_H"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"
after_includes = """
#define WXR_VERSION_MAJOR 0
#define WXR_VERSION_MINOR 2
#define WXR_VERSION_PATCH 4
"""

[parse]
parse_deps = false

[export]
item_types = ["enums", "structs", "opaque", "typedefs", "functions"]
include = ["FieldType"]

[enum]
prefix_with_name = true
