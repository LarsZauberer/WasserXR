language = "C"
include_guard = "WASSERXR_H"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen. Do not edit manually. */"

[parse]
parse_deps = false

[export]
include = [
    "WXRScene",
    "WXREntity",
    "wxr_create_scene",
    "wxr_destroy_scene",
    "wxr_add_entity",
    "wxr_get_entities_count",
    "wxr_get_entities",
]
item_types = ["opaque", "typedefs", "functions"]
